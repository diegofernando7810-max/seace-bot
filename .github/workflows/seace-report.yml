name: Reporte Compras Publicas - La Libertad

on:
  schedule:
    - cron: '0 13 * * *'    # 8:00 AM Peru (UTC-5)
    - cron: '30 23 * * *'   # 6:30 PM Peru (UTC-5)
  workflow_dispatch:

jobs:
  send-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4

      - name: Determinar turno
        id: turno
        run: |
          HOUR=$(date -u +%H)
          if [ "$HOUR" -ge 12 ] && [ "$HOUR" -lt 20 ]; then
            echo "TURNO=MANANA" >> $GITHUB_OUTPUT
          else
            echo "TURNO=TARDE" >> $GITHUB_OUTPUT
          fi

      - name: Enviar reporte a Telegram
        run: python seace_report.py "${{ steps.turno.outputs.TURNO }}"
